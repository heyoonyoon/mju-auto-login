<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon128.png" alt="" width="56" height="56">
    <h1>명지대 자동 로그인</h1>
    <p>아스트라(LMS)·MSI 등 통합로그인</p>
  </header>

  <label class="row">
    <span>
      <strong>자동 로그인</strong>
      <small id="status">켜짐</small>
    </span>
    <input id="enabled" type="checkbox" role="switch" checked>
  </label>

  <label class="row sub">
    <span>
      <strong>비밀번호 변경 안내 건너뛰기</strong>
      <small>로그인 후 뜨는 변경 안내를 자동으로 넘김</small>
    </span>
    <input id="skipPwChange" type="checkbox" role="switch" checked>
  </label>

  <label class="row sub">
    <span>
      <strong>공지 창 자동으로 닫기</strong>
      <small>아스트라(LMS)의 '나를 위한 공지' 창</small>
    </span>
    <input id="closeNotice" type="checkbox" role="switch" checked>
  </label>

  <div class="row choice" id="noticeCloseMode">
    <label><input type="radio" name="noticeCloseMode" value="once" checked> 한 번만 닫기</label>
    <label><input type="radio" name="noticeCloseMode" value="today"> 오늘 하루 보지 않기</label>
  </div>

  <footer>
    <a href="https://github.com/heyoonyoon/mju-auto-login" target="_blank">GitHub</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
